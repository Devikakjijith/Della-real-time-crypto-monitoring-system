{% extends "dashboard/base.html" %}
{% block title %}News{% endblock %}

{% block extra_css %}
<style>
    .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
    }

    .news-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        transition: all 0.2s;
        text-decoration: none;
        display: block;
        cursor: pointer;
    }

    .news-card:hover {
        border-color: #3b82f6;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(59,130,246,0.1);
    }

    .news-source {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .source-name {
        font-size: 11px;
        color: #3b82f6;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .news-time {
        font-size: 11px;
        color: #6b7280;
    }

    .news-title {
        font-size: 15px;
        font-weight: 700;
        color: #111827;
        line-height: 1.5;
        margin-bottom: 10px;
    }

    .news-desc {
        font-size: 13px;
        color: #4b5563;
        line-height: 1.6;
        margin-bottom: 14px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .news-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .news-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }

    .news-tag {
        padding: 3px 8px;
        background: rgba(59,130,246,0.1);
        border: 1px solid rgba(59,130,246,0.2);
        border-radius: 20px;
        font-size: 11px;
        color: #60a5fa;
    }

    .read-more {
        font-size: 12px;
        color: #3b82f6;
        font-weight: 600;
    }

    .news-filter-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 7px 16px;
        border-radius: 20px;
        border: 1px solid #d1d5db;
        background: transparent;
        color: #6b7280;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
        background: #3b82f6;
        border-color: #3b82f6;
        color: white;
    }

    .news-loading {
        text-align: center;
        padding: 60px;
        color: #d1d5db;
        font-size: 14px;
    }

    .news-loading-spinner {
        font-size: 36px;
        margin-bottom: 16px;
        animation: spin 2s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    .news-error {
        text-align: center;
        padding: 60px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
    }

    .news-error-icon { font-size: 48px; margin-bottom: 16px; }
    .news-error-title {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
    }
    .news-error-desc {
        font-size: 14px;
        color: #6b7280;
    }

    .news-image {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 14px;
        background: #f9fafb;
    }

    .sentiment-badge {
        padding: 3px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
    }

    .sentiment-positive {
        background: #dcfce7;
        color: #22c55e;
    }

    .sentiment-negative {
        background: #fee2e2;
        color: #ef4444;
    }

    .sentiment-neutral {
        background: rgba(107,114,128,0.15);
        color: #4b5563;
    }

    .refresh-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(59,130,246,0.15);
        border: 1px solid rgba(59,130,246,0.3);
        border-radius: 8px;
        color: #3b82f6;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .refresh-btn:hover {
        background: rgba(59,130,246,0.25);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">📰 Crypto News</div>
        <div class="page-subtitle">
            Latest news from the crypto world
        </div>
    </div>
    <button class="refresh-btn" onclick="loadNews(currentFilter)">
        🔄 Refresh
    </button>
</div>

<!-- Filter Bar -->
<div class="news-filter-bar">
    <button class="filter-btn active"
            onclick="loadNews('crypto', this)">
        All Crypto
    </button>
    <button class="filter-btn"
            onclick="loadNews('bitcoin', this)">
        ₿ Bitcoin
    </button>
    <button class="filter-btn"
            onclick="loadNews('ethereum', this)">
        Ξ Ethereum
    </button>
    <button class="filter-btn"
            onclick="loadNews('solana', this)">
        ◎ Solana
    </button>
    <button class="filter-btn"
            onclick="loadNews('defi', this)">
        🏦 DeFi
    </button>
    <button class="filter-btn"
            onclick="loadNews('nft', this)">
        🎨 NFT
    </button>
</div>

<!-- News Grid -->
<div id="news-container">
    <div class="news-loading">
        <div class="news-loading-spinner">📰</div>
        Loading latest news...
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentFilter = 'crypto';

function timeAgo(dateStr) {
    const date = new Date(dateStr);
    const now  = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60)     return `${diff}s ago`;
    if (diff < 3600)   return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400)  return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
}

function getSentiment(title, desc) {
    const text = (title + ' ' + (desc||'')).toLowerCase();
    const positive = [
        'surge','rally','soar','gain','rise','bullish',
        'high','record','jump','pump','growth','profit',
        'up','buy','adoption','breakthrough'
    ];
    const negative = [
        'crash','drop','fall','bear','loss','down',
        'sell','hack','scam','ban','fear','plunge',
        'decline','warning','risk','collapse'
    ];

    let posScore = 0;
    let negScore = 0;

    positive.forEach(w => {
        if (text.includes(w)) posScore++;
    });
    negative.forEach(w => {
        if (text.includes(w)) negScore++;
    });

    if (posScore > negScore)
        return ['Positive', 'sentiment-positive'];
    if (negScore > posScore)
        return ['Negative', 'sentiment-negative'];
    return ['Neutral', 'sentiment-neutral'];
}

function getCoinTags(title) {
    const text  = title.toLowerCase();
    const coins = {
        'bitcoin': 'BTC', 'btc': 'BTC',
        'ethereum': 'ETH', 'eth': 'ETH',
        'solana': 'SOL', 'sol': 'SOL',
        'bnb': 'BNB', 'binance': 'BNB',
        'xrp': 'XRP', 'ripple': 'XRP',
        'cardano': 'ADA', 'ada': 'ADA',
        'dogecoin': 'DOGE', 'doge': 'DOGE',
        'polygon': 'MATIC', 'matic': 'MATIC'
    };
    const found = new Set();
    Object.entries(coins).forEach(([key, val]) => {
        if (text.includes(key)) found.add(val);
    });
    return [...found].slice(0, 3);
}

async function loadNews(query, btn) {
    currentFilter = query;

    // Fix: sync active button even from Refresh click
    document.querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));
    if (btn) {
        btn.classList.add('active');
    } else {
        document.querySelectorAll('.filter-btn')
            .forEach(b => {
                if (b.textContent.trim().toLowerCase()
                        .includes(query === 'crypto'
                            ? 'all' : query)) {
                    b.classList.add('active');
                }
            });
    }

    const container =
        document.getElementById('news-container');
    container.innerHTML = `
        <div class="news-loading">
            <div class="news-loading-spinner">📰</div>
            Loading ${query} news...
        </div>
    `;

    try {
        // Calls Flask proxy at /api/news — avoids
        // CORS issues with external APIs
        const res  = await fetch(`/api/news?query=${query}`);

        if (!res.ok) {
            throw new Error(`Server error: ${res.status}`);
        }

        const data = await res.json();

        if (data.error) {
            throw new Error(data.error);
        }

        if (!data.results || data.results.length === 0) {
            throw new Error('No articles returned');
        }

        // Map CryptoPanic response → card format
        const articles = data.results.slice(0, 9).map(a => ({
            title:       a.title,
            description: a.metadata?.description
                          ? a.metadata.description
                              .substring(0, 200) + '...'
                          : a.title,
            url:         a.url,
            publishedAt: a.published_at,
            source:      { name: a.source?.title
                                 || 'CryptoPanic' },
            image:       a.metadata?.image || null
        }));

        renderNews(articles);

    } catch(e) {
        console.error('News error:', e);
        container.innerHTML = `
            <div class="news-error">
                <div class="news-error-icon">📡</div>
                <div class="news-error-title">
                    News Temporarily Unavailable
                </div>
                <div class="news-error-desc">
                    ${e.message || 'Could not fetch news.'}
                    Please try refreshing.
                </div>
            </div>
        `;
    }
}
function renderNews(articles) {
    const container =
        document.getElementById('news-container');

    if (!articles || articles.length === 0) {
        container.innerHTML = `
            <div class="news-error">
                <div class="news-error-icon">📭</div>
                <div class="news-error-title">
                    No News Found
                </div>
                <div class="news-error-desc">
                    Try a different filter or
                    refresh the page.
                </div>
            </div>
        `;
        return;
    }

    container.innerHTML =
        '<div class="news-grid"></div>';
    const grid =
        container.querySelector('.news-grid');

    articles.forEach(article => {
        const title   = article.title || 'No title';
        const desc    = article.description || '';
        const url     = article.url || '#';
        const source  = article.source?.name || 'News';
        const pubDate = article.publishedAt || '';
        const image   = article.image || null;

        const [sentiment, sentClass] =
            getSentiment(title, desc);
        const tags = getCoinTags(title);
        const time = pubDate ? timeAgo(pubDate) : '';

        const card = document.createElement('a');
        card.href   = url;
        card.target = '_blank';
        card.className = 'news-card';
        card.rel    = 'noopener noreferrer';

        card.innerHTML = `
            ${image ? `
                <img src="${image}"
                     class="news-image"
                     onerror="this.style.display='none'"
                     alt="news image">
            ` : ''}
            <div class="news-source">
                <span class="source-name">
                    ${source}
                </span>
                <span class="news-time">${time}</span>
            </div>
            <div class="news-title">${title}</div>
            <div class="news-desc">${desc}</div>
            <div class="news-footer">
                <div class="news-tags">
                    ${tags.map(t =>
                        `<span class="news-tag">
                            ${t}
                        </span>`
                    ).join('')}
                    <span class="sentiment-badge
                                 ${sentClass}">
                        ${sentiment}
                    </span>
                </div>
                <span class="read-more">
                    Read →
                </span>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Load on page open
loadNews('crypto');

// Auto refresh every 5 minutes
setInterval(() => loadNews(currentFilter), 300000);
</script>
{% endblock %}
